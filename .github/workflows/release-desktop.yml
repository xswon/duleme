name: Desktop Release

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release-desktop.yml"
      - "build/**"
      - "electron/**"
      - "scripts/smoke-macos-dmg.sh"
      - "server.ts"
      - "server-entry.ts"
      - "src/utils/sanitizeHtml.ts"
      - "package.json"
      - "package-lock.json"
      - "electron-builder.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  mac:
    needs: verify
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build desktop application
        run: npm run build:desktop
      - name: Build unsigned DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx --yes electron-builder@26.16.1 --config electron-builder.yml --mac --${{ matrix.arch }} --publish never
      - name: Mount, copy and start packaged app
        run: bash scripts/smoke-macos-dmg.sh "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: duleme-macos-${{ matrix.arch }}-${{ github.sha }}
          path: release/*.dmg
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: mac
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: duleme-macos-*-${{ github.sha }}
          path: release
          merge-multiple: true

      - name: Create checksums
        run: sha256sum release/*.dmg > release/SHA256SUMS.txt

      - name: Check public release token
        env:
          RELEASE_REPO_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: test -n "$RELEASE_REPO_TOKEN"

      - name: Prepare release notes
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## 读了么 Desktop 公测版

          这是未经过 Apple Developer ID 签名和 notarization 的 macOS 公测构建。

          首次打开时，如果 macOS 阻止启动，请先尝试打开一次，然后前往：
          **系统设置 → 隐私与安全性 → 仍要打开**

          不需要运行 Terminal 命令。

          - Apple Silicon：下载 `arm64` DMG
          - Intel Mac：下载 `x64` DMG
          - 两个架构均已在对应的全新 GitHub-hosted macOS VM 上完成 DMG 挂载、复制和应用启动 smoke test
          - 可使用 `SHA256SUMS.txt` 校验下载文件
          EOF

      - name: Publish public GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME"             release/*.dmg             release/SHA256SUMS.txt             --repo xswon/duleme-releases             --target main             --title "读了么 $GITHUB_REF_NAME"             --notes-file "$RUNNER_TEMP/release-notes.md"             --prerelease
