name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Build unsigned DMGs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx --yes electron-builder@26.16.1 --config electron-builder.yml --mac --publish never

      - name: Create checksums
        shell: bash
        run: |
          cd release
          shasum -a 256 *.dmg > SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: duleme-macos-${{ github.ref_name }}
          path: |
            release/*.dmg
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Check public release token
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_REPO_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: test -n "$RELEASE_REPO_TOKEN"

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## 读了么 Desktop 公测版

          这是未经过 Apple Developer ID 签名和 notarization 的 macOS 公测构建。

          首次打开时，如果 macOS 阻止启动，请先尝试打开一次，然后前往：
          **系统设置 → 隐私与安全性 → 仍要打开**

          不需要运行 Terminal 命令。

          - Apple Silicon：下载 `arm64` DMG
          - Intel Mac：下载 `x64` DMG
          - 可使用 `SHA256SUMS.txt` 校验下载文件
          EOF

      - name: Publish public GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME"             release/*.dmg release/SHA256SUMS.txt             --repo xswon/duleme-releases             --title "读了么 $GITHUB_REF_NAME"             --notes-file "$RUNNER_TEMP/release-notes.md"
