<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script id="appearance-init">
      // Pre-paint bootstrap; validation mirrors appearancePreferences.ts.
      (function () {
        var preference = "system";
        try {
          var saved = JSON.parse(localStorage.getItem("wreader.appearance.v1") || "{}");
          if (saved && /^(system|light|dark)$/.test(saved.theme)) preference = saved.theme;
        } catch { /* Unavailable or invalid storage defaults to the system. */ }
        var dark = preference === "dark" || (preference === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      }());
    </script>
    <style>html{background:#fff}html[data-theme="dark"]{background:#1c1f22}</style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f8fb" />
    <meta name="description" content="读了么：本地优先的 RSS 与播客阅读器" />
    <link rel="icon" type="image/svg+xml" href="/brand-icon-navy.svg" />
    <title>读了么</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
