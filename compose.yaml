services:
  wreader:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: wreader-dev
    restart: unless-stopped
    environment:
      PORT: 4387
      HMR_PORT: 4388
      DOCKER: "true"
    ports:
      - "4387:4387"
      - "4388:4388"
    volumes:
      - .:/app
      - wreader_node_modules:/app/node_modules

volumes:
  wreader_node_modules:
